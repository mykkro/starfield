<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starfield</title><link rel="stylesheet" href="style.css"><script src="starfield.js" defer></script></head>
<body><canvas id="sky" aria-label="Interactive starfield. Drag to orbit; scroll to zoom."></canvas><header>✦ &nbsp; STARFIELD <span>/ 02</span></header><main><section class="panel" aria-label="Starfield controls"><p class="eyebrow">A SMALL UNIVERSE</p><h1>A thousand points<br>of possibility.</h1><p class="intro">An old experiment, under a new sky.</p><label for="count">Stars <output id="count-value">1,000</output></label><input id="count" type="range" min="100" max="20000" step="100" value="1000"><label for="size">Star size <output id="size-value">0.050</output></label><input id="size" type="range" min="0.01" max="0.12" step="0.005" value="0.05"><label class="toggle"><input id="rotate" type="checkbox"> Slowly orbit</label><div class="actions"><button id="regenerate" type="button">New constellation ↗</button><button id="reset" type="button">Reset</button></div></section></main><footer><span id="status" role="status">1,000 stars · sphere radius 10</span><span>DRAG TO ORBIT · SCROLL TO EXPLORE</span></footer><p id="error" role="alert" hidden></p></body></html>
